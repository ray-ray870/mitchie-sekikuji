<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>みっちーの席決めくじ引き</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon-1024.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="みっちーの席くじ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5b3d8a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --purple-deep:#5b3d8a;
    --purple-mid:#8c6bc4;
    --purple-soft:#e7ddf7;
    --cream:#faf6ef;
    --gold:#f2b632;
    --coral:#ff7e6b;
    --mint:#5fc9b0;
    --ink:#2f2440;
    --fixed:#f2b632;
    --shadow:0 10px 24px rgba(91,61,138,0.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;min-height:100%;overscroll-behavior:none;}
  html{background:#fbf2ee;}
  body{
    font-family:'M PLUS Rounded 1c','Zen Maru Gothic',sans-serif;
    background:
      radial-gradient(circle at 18% -4%, #ece0fb 0%, transparent 48%),
      radial-gradient(circle at 92% 96%, #e2f4ec 0%, transparent 46%),
      linear-gradient(175deg, #faf6ef 0%, #fbf2ee 100%);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
  }
  h1,h2,h3{font-family:'Zen Maru Gothic',sans-serif; margin:0;}
  button{font-family:inherit; border:none; cursor:pointer; -webkit-tap-highlight-color:transparent;}
  input{font-family:inherit;}
  #app{flex:1; display:flex; flex-direction:column; min-height:100vh; position:relative; width:100%; max-width:600px; margin:0 auto;}

  /* ---------- Header ---------- */
  .topbar{
    padding:16px 18px 10px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .brand{display:flex; align-items:center; gap:9px; min-width:0;}
  .brand-badge-img{
    width:36px; height:36px; border-radius:50%; object-fit:cover; flex-shrink:0;
    box-shadow:var(--shadow); border:2px solid #fff;
  }
  .brand-title{
    font-weight:900; font-size:15.5px; color:var(--purple-deep); letter-spacing:.01em;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .reset-link{
    font-size:12.5px; font-weight:700; color:#a08cc4; background:#fff; flex-shrink:0;
    padding:7px 15px; border-radius:999px; border:1.5px solid var(--purple-soft);
  }
  .back-link{
    font-size:12.5px; font-weight:700; color:var(--purple-deep); background:#fff; flex-shrink:0;
    padding:7px 15px; border-radius:999px; border:1.5px solid var(--purple-soft);
  }

  /* ---------- Screen container ---------- */
  .screen{flex:1; display:flex; flex-direction:column; padding:0 20px 20px; animation:fadeIn .35s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  /* ---------- Start screen ---------- */
  .start-screen{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:18px; padding:20px 20px 36px; position:relative;
  }
  .start-blob{position:absolute; border-radius:50%; filter:blur(2px); pointer-events:none; z-index:0; opacity:.4;}
  .start-blob.b1{width:220px; height:220px; background:radial-gradient(circle,#e4d4fb,transparent 70%); top:2%; left:-12%;}
  .start-blob.b2{width:260px; height:260px; background:radial-gradient(circle,#d7f2e6,transparent 70%); bottom:6%; right:-14%;}
  .start-blob.b3{width:160px; height:160px; background:radial-gradient(circle,#ffe3ef,transparent 70%); top:38%; right:4%;}
  .start-screen > *:not(.start-blob){position:relative; z-index:1;}
  .start-kicker{
    font-size:12px; font-weight:800; letter-spacing:.16em; color:var(--purple-mid);
    text-transform:uppercase; margin-bottom:-6px;
  }
  .start-emblem-wrap{position:relative; margin-bottom:2px; flex-shrink:0;}
  .start-emblem-shadow{
    position:absolute; left:50%; bottom:-6px; width:78px; height:16px; transform:translateX(-50%);
    background:radial-gradient(ellipse,rgba(91,61,138,.28),transparent 72%); z-index:0;
    animation:mitchieShadow 3s ease-in-out infinite;
  }
  .start-emblem-img{width:112px; height:auto; filter:drop-shadow(0 10px 18px rgba(91,61,138,.3)); animation:mitchieFloat 3s ease-in-out infinite; position:relative; z-index:1;}
  @keyframes mitchieFloat{0%{transform:translateY(0);}50%{transform:translateY(-12px);}100%{transform:translateY(0);}}
  @keyframes mitchieShadow{0%{transform:translateX(-50%) scale(1);opacity:.6;}50%{transform:translateX(-50%) scale(.72);opacity:.32;}100%{transform:translateX(-50%) scale(1);opacity:.6;}}
  .start-title{font-size:27px; color:var(--purple-deep); font-weight:900; line-height:1.35; letter-spacing:.01em; margin:2px 0 0;}
  .big-btn{
    width:208px; height:208px; border-radius:50%; margin-top:8px; flex-shrink:0;
    background:linear-gradient(150deg,var(--purple-mid),var(--purple-deep));
    color:#fff; font-size:27px; font-weight:900;
    box-shadow:0 18px 36px rgba(91,61,138,.38), 0 0 0 7px rgba(140,107,196,.14), inset 0 2px 0 rgba(255,255,255,.25);
    display:flex; align-items:center; justify-content:center;
    letter-spacing:.08em;
    transition:transform .15s ease;
  }
  .big-btn:active{transform:scale(.96);}
  .share-btn{
    width:auto; display:inline-flex; align-items:center; justify-content:center; gap:5px;
    margin-top:14px; padding:9px 18px; border-radius:999px;
    font-size:12.5px; font-weight:700; color:#8b7ba8; background:#fff; border:1.5px solid var(--purple-soft);
    box-shadow:0 4px 12px rgba(91,61,138,.08);
  }
  .unofficial-badge{
    margin-top:22px; display:inline-flex; padding:4px 13px; border-radius:999px;
    background:rgba(139,123,164,.08); color:#a89bbd; font-size:10px; font-weight:700; letter-spacing:.03em;
  }
  .start-credit{
    margin-top:9px; font-size:10px; color:#c3bad2; line-height:1.9;
  }
  .toast{
    position:fixed; left:50%; bottom:32px; transform:translateX(-50%) translateY(10px);
    background:var(--purple-deep); color:#fff; padding:13px 24px; border-radius:999px;
    font-size:14.5px; font-weight:700; box-shadow:0 12px 28px rgba(0,0,0,.28);
    z-index:400; opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
    max-width:86vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  /* ---------- Form pieces ---------- */
  .section-title{font-size:18px; font-weight:700; color:var(--purple-deep); margin:22px 0 12px; display:flex; align-items:center; gap:6px;}
  .step-chip{
    display:inline-flex; align-items:center; gap:9px; background:var(--purple-soft); color:var(--purple-deep);
    padding:6px 18px 6px 6px; border-radius:999px; margin:22px 0 14px;
  }
  .step-chip-num{
    width:28px; height:28px; border-radius:50%; background:var(--purple-deep); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:900; flex-shrink:0;
  }
  .step-chip-label{font-size:16px; font-weight:700;}
  .card{
    background:#fff; border-radius:18px; padding:18px; box-shadow:var(--shadow); margin-bottom:14px;
  }
  .field-row{display:flex; align-items:center; justify-content:space-between; padding:12px 2px;}
  .field-label{font-size:16px; font-weight:700; color:var(--ink);}
  .stepper{display:flex; align-items:center; gap:14px;}
  .stepper button{
    width:42px; height:42px; border-radius:50%; background:var(--purple-soft); color:var(--purple-deep);
    font-size:22px; font-weight:900; display:flex; align-items:center; justify-content:center;
  }
  .stepper button:active{background:var(--purple-mid); color:#fff;}
  .stepper .val{min-width:38px; text-align:center; font-size:21px; font-weight:900; color:var(--purple-deep);}
  .num-input{
    width:84px; padding:10px 10px; border-radius:10px; border:2px solid var(--purple-soft);
    font-size:18px; font-weight:700; text-align:center; color:var(--purple-deep);
  }
  .num-input:focus{outline:none; border-color:var(--purple-mid);}
  .shape-toggle{display:flex; gap:8px;}
  .shape-btn{
    padding:10px 16px; border-radius:12px; background:var(--purple-soft); color:var(--purple-deep); font-weight:700; font-size:15px;
  }
  .shape-btn.active{background:var(--purple-deep); color:#fff;}

  .names-textarea{
    width:100%; margin-top:12px; padding:14px; border-radius:12px; border:2px solid var(--purple-soft);
    font-size:16px; font-weight:600; color:var(--ink); resize:vertical; box-sizing:border-box;
    font-family:inherit; line-height:1.6;
  }
  .names-textarea:focus{outline:none; border-color:var(--purple-mid);}
  .name-chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .name-chip{
    padding:9px 16px; border-radius:999px; background:var(--purple-soft); color:var(--purple-deep);
    font-weight:700; font-size:15px;
  }
  .name-chip:active{background:var(--purple-mid); color:#fff;}

  .table-seat-row{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px dashed #eee0fa;}
  .table-seat-row:last-child{border-bottom:none;}
  .table-seat-row .label{font-size:15.5px; font-weight:700; color:#6b5c86;}
  .seat-sum-note{font-size:14px; color:#a08cc4; text-align:right; margin-top:6px;}
  .seat-sum-note.ok{color:var(--mint); font-weight:700;}
  .seat-sum-note.bad{color:var(--coral); font-weight:700;}

  .primary-btn{
    width:100%; padding:18px; border-radius:16px; background:linear-gradient(120deg,var(--purple-mid),var(--purple-deep));
    color:#fff; font-size:19px; font-weight:900; box-shadow:var(--shadow); letter-spacing:.02em;
  }
  .primary-btn:disabled{background:#d7cbe9; box-shadow:none; color:#fff9;}
  .draw-btn-big{padding:26px; font-size:24px; border-radius:20px; box-shadow:0 10px 26px rgba(91,61,138,.4);}
  .primary-btn:active:not(:disabled){transform:scale(.985);}
  .ghost-btn{
    width:100%; padding:16px; border-radius:16px; background:#fff; color:var(--purple-deep);
    font-size:17px; font-weight:700; border:2px solid var(--purple-soft); margin-top:10px;
  }
  .spacer{flex:1;}

  /* ---------- Layout screen (tables + seats) ---------- */
  .layout-toolbar{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap;}
  .hint-chip{
    font-size:13.5px; color:var(--purple-deep); background:var(--purple-soft); padding:7px 12px; border-radius:999px; font-weight:700;
  }
  .canvas-wrap{
    flex:1; background:#fff; border-radius:20px; box-shadow:var(--shadow); position:relative; overflow-y:auto; overflow-x:auto;
    min-height:340px; -webkit-overflow-scrolling:touch;
  }
  .canvas-inner{display:flex; flex-direction:column; align-items:safe center; justify-content:center; gap:26px; min-height:100%; min-width:100%; padding:24px 16px; box-sizing:border-box;}
  .table-block{position:relative; flex-shrink:0;}
  .table-surface{
    position:absolute; background:linear-gradient(160deg,#efe3ff,#d9c6f5); box-shadow:inset 0 0 0 2px #c9b3ea, 0 6px 14px rgba(91,61,138,.15);
  }
  .table-surface.circle{border-radius:50%;}
  .table-surface.square{border-radius:20px;}
  .table-num{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-weight:900; color:var(--purple-deep); font-size:18px; background:#fff; border-radius:999px;
    padding:6px 16px; box-shadow:0 2px 6px rgba(91,61,138,.2); white-space:nowrap;
  }
  .cushion{
    position:absolute; width:70px; height:70px; border-radius:50%;
    background:var(--purple-mid); color:#fff; font-weight:900; font-size:18px;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    box-shadow:0 5px 14px rgba(91,61,138,.35); cursor:grab; touch-action:none;
    border:4px solid #fff; overflow:hidden; box-sizing:border-box;
    transition:left .22s ease, top .22s ease;
  }
  .cushion.dragging{ transition:none; }
  .cushion .name{font-size:13px; font-weight:700; max-width:58px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cushion .seat-num{font-size:20px; font-weight:900; line-height:1;}
  .cushion.named-result{padding:0;}
  .cushion .seat-num-small{font-size:10px; font-weight:800; line-height:1; opacity:.85; margin-bottom:2px;}
  .cushion.named-result .name-big{
    font-size:21px; font-weight:900; line-height:1; letter-spacing:.01em;
    display:block; max-width:56px; overflow:hidden; text-align:center; white-space:nowrap;
  }
  .cushion.named-result .name-big.two-line{font-size:15px; white-space:normal;}
  .cushion.named-result .name-big .name-line{display:block; line-height:1.1;}
  .cushion.named-result .name-big.latin{font-size:17px; line-height:1.25;}
  .cushion.named-result .name-big.latin.two-line{font-size:13px;}
  .cushion.named-result .name-big.latin .name-line{line-height:1.25;}
  .cushion.fixed{background:var(--gold); color:#5b3d0f;}
  .cushion.assigned{background:var(--mint); cursor:pointer;}
  .cushion.dragging{cursor:grabbing; z-index:50; box-shadow:0 8px 18px rgba(91,61,138,.4);}
  .cushion.just-assigned{ animation:seatBlink 0.9s ease-in-out infinite; z-index:20; }
  @keyframes seatBlink{
    0%,100%{ box-shadow:0 5px 14px rgba(91,61,138,.35); transform:scale(1); }
    50%{ box-shadow:0 0 0 8px rgba(255,196,64,.55), 0 5px 14px rgba(91,61,138,.35); transform:scale(1.12); }
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(47,36,64,.5); display:flex; align-items:center; justify-content:center;
    z-index:200; padding:24px;
  }
  .modal-box{background:#fff; border-radius:20px; padding:24px; width:100%; max-width:340px; box-shadow:0 20px 40px rgba(0,0,0,.25);}
  .modal-title{font-size:17px; font-weight:900; color:var(--purple-deep); margin-bottom:16px;}
  .modal-input{
    width:100%; padding:14px 16px; border-radius:12px; border:2px solid var(--purple-soft); font-size:17px; margin-bottom:14px;
  }
  .modal-input:focus{outline:none; border-color:var(--purple-mid);}
  .modal-input.input-error{border-color:var(--coral); animation:shake .3s;}
  @keyframes shake{0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);}}
  .modal-actions{display:flex; gap:8px;}
  .modal-actions button{flex:1; padding:14px; border-radius:12px; font-weight:700; font-size:16px;}
  .modal-save{background:var(--purple-deep); color:#fff;}
  .modal-delete{background:#fdeceb; color:var(--coral);}
  .modal-cancel{background:#f1edf7; color:#8b7ba8;}

  /* ---------- Bottom nav ---------- */
  .bottom-nav{display:flex; gap:10px; margin-top:14px;}
  .bottom-nav .primary-btn{flex:1;}

  /* ---------- Name input screen ---------- */
  .name-list{display:flex; flex-direction:column; gap:8px; margin-bottom:12px;}
  .name-item{
    display:flex; align-items:center; gap:10px; background:#fff; border-radius:14px; padding:10px 12px; box-shadow:var(--shadow);
  }
  .name-item .idx{
    width:26px; height:26px; border-radius:50%; background:var(--purple-soft); color:var(--purple-deep); font-size:12px; font-weight:900;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .name-item.fixed .idx{background:var(--gold); color:#5b3d0f;}
  .name-item input{flex:1; border:none; font-size:15px; font-weight:700; background:transparent;}
  .name-item input:focus{outline:none;}
  .name-item .tag{font-size:10px; color:var(--gold); font-weight:900; flex-shrink:0;}
  .name-item .del{color:#d9c9ef; font-size:18px; flex-shrink:0; padding:4px;}
  .progress-note{font-size:15px; color:#8b7ba8; margin-bottom:8px; font-weight:700;}
  .progress-note.ok{color:var(--mint);}

  /* ---------- Draw screen ---------- */
  .draw-header{text-align:center; margin:6px 0 18px;}
  .draw-header .count{font-size:15px; color:#8b7ba8; font-weight:700;}
  .peek-link{
    display:block; width:100%; box-sizing:border-box; margin-bottom:12px; font-size:15.5px; font-weight:900; color:var(--purple-deep);
    background:#fff; padding:14px 16px; border-radius:14px; text-align:center;
    border:2px solid var(--purple-mid); box-shadow:0 3px 10px rgba(91,61,138,.15);
  }
  .peek-link:active{background:var(--purple-soft);}
  .draw-chips{display:flex; flex-wrap:wrap; gap:10px; justify-content:center;}
  .draw-chip{
    padding:18px 26px; border-radius:16px; background:#fff; box-shadow:var(--shadow); font-size:18px; font-weight:900; color:var(--purple-deep);
    border:2px solid var(--purple-soft);
  }
  .draw-chip:active{transform:scale(.96); background:var(--purple-soft);}
  .empty-note{text-align:center; color:#a08cc4; font-size:16px; margin-top:30px; line-height:1.8;}

  /* ---------- Lottery overlay ---------- */
  .lottery-overlay{
    position:fixed; inset:0; background:linear-gradient(160deg,var(--purple-deep),#3b2a5c);
    display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:300; color:#fff;
  }
  .lottery-name{font-size:24px; font-weight:700; opacity:.9; margin-bottom:10px;}
  .lottery-label{font-size:19px; opacity:.8; margin-bottom:22px; letter-spacing:.1em;}
  .lottery-number-circle{
    width:230px; height:230px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 22% 18%, #d9c6f5 0%, transparent 55%),
      radial-gradient(circle at 82% 86%, #bdeeda 0%, transparent 55%),
      linear-gradient(160deg, #9b7fd4 0%, #6e4fa8 100%);
    box-shadow:0 22px 46px rgba(0,0,0,.32), inset 0 3px 0 rgba(255,255,255,.25);
  }
  .lottery-number{
    font-size:118px; font-weight:900; font-family:'Zen Maru Gothic',sans-serif;
    text-shadow:0 6px 18px rgba(0,0,0,.35); color:#fff; line-height:1;
  }
  .lottery-number.settled{animation:pop .45s cubic-bezier(.2,1.6,.4,1);}
  @keyframes pop{0%{transform:scale(.6);} 60%{transform:scale(1.15);} 100%{transform:scale(1);}}
  .lottery-sub{font-size:20px; font-weight:700; opacity:.95; margin-top:16px;}
  .lottery-baby-img{width:64px; height:auto; margin-top:16px; animation:babyPop .5s cubic-bezier(.2,1.6,.4,1);}
  @keyframes babyPop{0%{transform:scale(0) rotate(-15deg); opacity:0;} 60%{transform:scale(1.2) rotate(6deg); opacity:1;} 100%{transform:scale(1) rotate(0);}}
  .lottery-ok{
    margin-top:34px; padding:18px 40px; border-radius:999px; background:#fff; color:var(--purple-deep);
    font-size:19px; font-weight:900; box-shadow:0 10px 24px rgba(0,0,0,.25); opacity:0; pointer-events:none; transition:opacity .3s;
    white-space:nowrap;
  }
  .lottery-ok.show{opacity:1; pointer-events:auto;}
  .mini-table-wrap{margin:26px 0 4px; display:flex; flex-direction:column; align-items:center;}
  .mini-table-label{font-size:18px; font-weight:700; opacity:.85; margin-bottom:14px; letter-spacing:.05em;}
  .mini-table{position:relative;}
  .mini-table-surface{position:absolute; background:rgba(255,255,255,.14); box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);}
  .mini-table-surface.circle{border-radius:50%;}
  .mini-table-surface.square{border-radius:16px;}
  .mini-seat{position:absolute; width:20px; height:20px; margin:-10px; border-radius:50%; background:rgba(255,255,255,.4);}
  .mini-seat.target{width:36px; height:36px; margin:-18px; background:var(--gold); animation:seatGlow 1s ease-in-out infinite;}
  @keyframes seatGlow{0%{box-shadow:0 0 0 0 rgba(242,182,50,.65);} 70%{box-shadow:0 0 0 16px rgba(242,182,50,0);} 100%{box-shadow:0 0 0 0 rgba(242,182,50,0);}}
  .decided-list{margin-top:22px; display:flex; flex-direction:column; gap:9px;}
  .decided-item{display:flex; align-items:center; gap:12px; background:#fff; border-radius:14px; padding:12px 14px; box-shadow:var(--shadow);}
  .decided-item .seat-badge{width:40px; height:40px; border-radius:50%; background:var(--mint); color:#fff; font-weight:900; font-size:15px; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .decided-item .dname{flex:1; font-weight:700; font-size:16px;}
  .decided-item .undo-btn{font-size:14px; color:var(--coral); font-weight:700; background:#fdeceb; padding:8px 14px; border-radius:10px; flex-shrink:0;}
  #confetti-canvas{position:fixed; inset:0; z-index:310; pointer-events:none;}

  /* ---------- Result screen ---------- */
  .result-note{text-align:center; font-size:15px; color:#8b7ba8; margin-bottom:14px; font-weight:700;}
  .result-family-wrap{display:flex; flex-direction:column; align-items:center; margin-bottom:6px;}
  .result-family-img{width:100%; max-width:280px; height:auto;}

  (function(){
  var app = document.getElementById('app');
  /* ================= UTIL ================= */
  function el(tag, cls, html){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }
  function stepChip(num, label){
    var chip = el('div','step-chip');
    chip.appendChild(el('div','step-chip-num', String(num)));
    chip.appendChild(el('div','step-chip-label', label));
    return chip;
  }
  function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function uid(){ return Math.random().toString(36).slice(2,9); }

  var state = { step:'start', history:[], tableCount:2, totalParticipants:8, shape:'square', seatCounts:[4,4], tables:[], participants:[], fixedModalSeat:null, audioCtx: null, presetNamesText: '', lastAssignedSeatNum: null };

  function goTo(step){
    state.history.push(state.step);
    state.step = step;
    render();
  }
  function goBack(){
    if(state.history && state.history.length > 0){
      state.step = state.history.pop();
      render();
    }
  }

  /* ================= PRESET NAMES ================= */
  function getPresetNamesList(){
    return (state.presetNamesText||'').split('\n')
      .map(function(s){ return s.trim(); })
      .filter(function(s){ return s.length>0; });
  }
  function usedNamesSet(){
    var used = {};
    state.participants.forEach(function(p){ if(p.assigned && p.name) used[p.name] = true; });
    state.tables.forEach(function(tbl){
      tbl.seats.forEach(function(seat){ if(seat.fixedName) used[seat.fixedName] = true; });
    });
    return used;
  }
  function availablePresetNames(){
    var used = usedNamesSet();
    return getPresetNamesList().filter(function(n){ return !used[n]; });
  }


  function getAudio(){
    if(!state.audioCtx){
      try{ state.audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
    }
    return state.audioCtx;
  }
  function playTick(){
    var ctx = getAudio(); if(!ctx) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type='square'; o.frequency.value = 700 + Math.random()*200;
    g.gain.value = 0.05;
    o.connect(g); g.connect(ctx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.08);
    o.stop(ctx.currentTime+0.09);
  }
  function playFanfare(){
    var ctx = getAudio(); if(!ctx) return;
    var notes = [523.25,659.25,783.99,1046.5];
    notes.forEach(function(freq,i){
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type='triangle'; o.frequency.value = freq;
      var start = ctx.currentTime + i*0.09;
      g.gain.value = 0.0001;
      o.connect(g); g.connect(ctx.destination);
      o.start(start);
      g.gain.exponentialRampToValueAtTime(0.12, start+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, start+0.5);
      o.stop(start+0.55);
    });

        vrot: (Math.random()-0.5)*18,
        life: 0
      });
    }
    if(!confettiRunning){ confettiRunning = true; requestAnimationFrame(confettiLoop); }
  }
  function confettiLoop(){
    cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
    confettiParticles.forEach(function(p){
      p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vrot; p.life++;
      cctx.save();
      cctx.translate(p.x,p.y); cctx.rotate(p.rot*Math.PI/180);
      cctx.fillStyle = p.color;
      cctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
      cctx.restore();
    });
    confettiParticles = confettiParticles.filter(function(p){ return p.y < confettiCanvas.height+40 && p.life < 260; });
    if(confettiParticles.length>0){ requestAnimationFrame(confettiLoop); }
    else { confettiRunning = false; }
  }

  /* ================= SEAT / TABLE LAYOUT ================= */
  // Computes realistic seat positions for a table.
  // circle (丸テーブル): seats spaced evenly all the way around.
  // square (長テーブル): seats split into a back row and a front row (no seats on the short ends),
  //   balanced as evenly as possible, e.g. 7 seats -> back 4 / front 3, 4 seats -> back 2 / front 2.
  function computeSeatLayout(count, shape, opts){
    opts = opts || {};
    var spacing = opts.spacing || 82;
    var tableDepth = opts.tableDepth || 84;
    var rowGap = opts.rowGap || 36;
    var circleR = opts.circleR || 122;
    var circleSize = opts.circleSize || 178;
    if(shape === 'circle'){
      var positions = [];
      for(var i=0;i<count;i++){
        var angle = (Math.PI*2*i/count) - Math.PI/2;
        positions.push({ x: Math.cos(angle)*circleR, y: Math.sin(angle)*circleR });
      }
      return { positions: positions, tableW: circleSize, tableH: circleSize, backCount:0, frontCount:0 };
    }
    // long table: back row gets the extra seat when count is odd
    var backCount = Math.ceil(count/2);
    var frontCount = Math.floor(count/2);
    var maxRow = Math.max(backCount, frontCount, 1);
    var tableW = maxRow*spacing + 16;
    var tableH = tableDepth;
    var backY = -(tableH/2 + rowGap);
    var frontY = (tableH/2 + rowGap);
    var positions = [];
    for(var b=0;b<backCount;b++){ positions.push({ x:(b-(backCount-1)/2)*spacing, y:backY }); }
    for(var f=0;f<frontCount;f++){ positions.push({ x:(f-(frontCount-1)/2)*spacing, y:frontY }); }
    return { positions: positions, tableW: tableW, tableH: tableH, backCount:backCount, frontCount:frontCount };
  }

  /* ---- Square/long table: seats live on one of 4 sides (top/bottom/left/right) ---- */
  function initSides(seats){
    var backCount = Math.ceil(seats.length/2);
    return {
      top: seats.slice(0, backCount),
      bottom: seats.slice(backCount),
      left: [],
      right: []
    };
  }
  function computeSideLayout(sides, opts){
    opts = opts || {};
    var spacing = opts.spacing || 82;
    var vSpacing = opts.vSpacing || 60;
    var tableDepth = opts.tableDepth || 84;
    var rowGap = opts.rowGap || 36;
    var colGap = (opts.colGap !== undefined) ? opts.colGap : rowGap;
    var topCount = sides.top.length, bottomCount = sides.bottom.length;
    var leftCount = sides.left.length, rightCount = sides.right.length;
    var maxRow = Math.max(topCount, bottomCount, 1);
    var tableW = maxRow*spacing + 16;
    var tableH = tableDepth;
    var backY = -(tableH/2 + rowGap);
    var frontY = (tableH/2 + rowGap);
    var leftX = -(tableW/2 + colGap);
    var rightX = (tableW/2 + colGap);
    var posMap = {};
    sides.top.forEach(function(s,i){ posMap[s.num] = { x:(i-(topCount-1)/2)*spacing, y:backY }; });
    sides.bottom.forEach(function(s,i){ posMap[s.num] = { x:(i-(bottomCount-1)/2)*spacing, y:frontY }; });
    sides.left.forEach(function(s,i){ posMap[s.num] = { x:leftX, y:(i-(leftCount-1)/2)*vSpacing }; });
    sides.right.forEach(function(s,i){ posMap[s.num] = { x:rightX, y:(i-(rightCount-1)/2)*vSpacing }; });
    return { posMap: posMap, tableW: tableW, tableH: tableH };
  }
  // Returns { positions: [...] (parallel to tbl.seats order), tableW, tableH }
  function seatPositionsForTable(tbl, opts){
    if(state.shape === 'circle'){
      return computeSeatLayout(tbl.seats.length, 'circle', opts);
    }
    var sideLayout = computeSideLayout(tbl.sides, opts);
    var positions = tbl.seats.map(function(s){ return sideLayout.posMap[s.num] || {x:0,y:0}; });
    return { positions: positions, tableW: sideLayout.tableW, tableH: sideLayout.tableH };
  }
  var CUSHION_SIZE = 70;
  var CUSHION_HALF = CUSHION_SIZE/2;
  // Computes the bounding box a table (with its seats) needs, so tables never overlap.
  // On wide screens (tablet/PC) shrink table blocks (via CSS zoom) so they fit
  // within the visible canvas width without needing horizontal scrolling.
  // On narrow (phone) screens we leave scrolling as-is, since shrinking further
  // would make names/numbers too small to read.
  function fitTableBlocksToWidth(canvasWrap){
    if(!canvasWrap) return;
    var isWide = window.matchMedia('(min-width:640px)').matches;
    var blocks = canvasWrap.querySelectorAll('.table-block');
    var available = canvasWrap.clientWidth - 32; // matches canvas-inner's 16px side padding
    blocks.forEach(function(block){
      block.style.zoom = '';
      if(!isWide) return;
      var natural = block.offsetWidth;
      if(natural > available && available > 40){
        var scale = Math.max(0.4, (available / natural) * 0.97);
        block.style.zoom = scale;
      }
    });
  }
  window.addEventListener('resize', function(){
    if(state.step === 'result'){
      fitTableBlocksToWidth(document.querySelector('.canvas-wrap'));
    }
  });

  function computeBlockSize(layout, cushionSize){
    cushionSize = cushionSize || CUSHION_SIZE;
    var minX=0,maxX=0,minY=0,maxY=0;
    layout.positions.forEach(function(p){
      minX = Math.min(minX,p.x); maxX = Math.max(maxX,p.x);
      minY = Math.min(minY,p.y); maxY = Math.max(maxY,p.y);
    });
    var w = Math.max(layout.tableW, (maxX-minX)+cushionSize) + 24;
    var h = Math.max(layout.tableH, (maxY-minY)+cushionSize) + 24;
    return { w:w, h:h };
  }
  function buildTables(){
    var tables = [];
    var seatNum = 1;
    for(var i=0;i<state.tableCount;i++){
      var count = state.seatCounts[i] || 1;
      var seats = [];
      for(var s=0;s<count;s++){
        seats.push({ num: seatNum, fixedName:null, name:null, dx:0, dy:0 });
        seatNum++;
      }
      var tbl = { id: 'tbl'+i, index:i+1, seatCount: count, seats: seats };
      if(state.shape !== 'circle'){ tbl.sides = initSides(seats); }
      var layout = seatPositionsForTable(tbl);
      var block = computeBlockSize(layout);
      tbl.blockW = block.w; tbl.blockH = block.h;
      tables.push(tbl);
    }
    state.tables = tables;
  }
  // Builds one table's full DOM (surface + numbered cushions) for either the layout editor or the result chart.
  function buildTableBlockDom(tbl, mode){
    var isSquare = (state.shape !== 'circle');
    var posMap = null, tableW, tableH, positions;
    if(isSquare){
      var sideLayout = computeSideLayout(tbl.sides);
      posMap = sideLayout.posMap;
      tableW = sideLayout.tableW; tableH = sideLayout.tableH;
      positions = tbl.seats.map(function(s){ return posMap[s.num] || {x:0,y:0}; });
    } else {
      var circleLayout = computeSeatLayout(tbl.seats.length, 'circle');
      tableW = circleLayout.tableW; tableH = circleLayout.tableH; positions = circleLayout.positions;
    }
    // Recompute block size every render: seats moved to the sides (or extra
    // seats added) can make the table wider/taller than it was when first built,
    // so relying on a size cached at buildTables() time would clip them.
    var block2 = computeBlockSize({ positions: positions, tableW: tableW, tableH: tableH });
    tbl.blockW = block2.w; tbl.blockH = block2.h;

    var block = el('div','table-block');
    block.style.width = tbl.blockW+'px';
    block.style.height = tbl.blockH+'px';
    var centerX = tbl.blockW/2, centerY = tbl.blockH/2;
    var surf = el('div','table-surface '+state.shape);
    surf.style.width = tableW+'px';
    surf.style.height = tableH+'px';
    surf.style.left = (centerX - tableW/2)+'px';
    surf.style.top = (centerY - tableH/2)+'px';
    block.appendChild(surf);
    block.appendChild(el('div','table-num','テーブル'+tbl.index));

    tbl.seats.forEach(function(seat, si){
      var pos = positions[si] || {x:0,y:0};
      var baseX = centerX + pos.x - CUSHION_HALF;
      var baseY = centerY + pos.y - CUSHION_HALF;
      var nameToShow = seat.fixedName || seat.name || null;
      var cls = 'cushion' + (seat.fixedName ? ' fixed' : (seat.name ? ' assigned' : ''));
      var showBigName = !!nameToShow;
      if(showBigName) cls += ' named-result';
      var cushion = el('div', cls);
      cushion.dataset.seatNum = seat.num;
      if(isSquare){
        cushion.style.left = baseX+'px';
        cushion.style.top = baseY+'px';
      } else {
        cushion.style.left = (baseX + seat.dx)+'px';
        cushion.style.top = (baseY + seat.dy)+'px';
      }
      if(!showBigName){
        cushion.appendChild(el('div','seat-num',String(seat.num)));
      } else {
        cushion.appendChild(el('div','seat-num-small',String(seat.num)));
        var isLatin = /^[A-Za-z]+$/.test(nameToShow.replace(/\s+/g,''));
        var maxLen = isLatin ? 6 : 4;
        var displayName = nameToShow.length > maxLen ? nameToShow.slice(0,maxLen) : nameToShow;
        var nameNode = el('div','name-big');
        if(isLatin) nameNode.classList.add('latin');
        if(isLatin && displayName.length > 3){
          nameNode.classList.add('two-line');
          var l1 = el('div','name-line'); l1.textContent = displayName.slice(0,3);
          var l2 = el('div','name-line'); l2.textContent = displayName.slice(3);
          nameNode.appendChild(l1);
          nameNode.appendChild(l2);
        } else if(!isLatin && displayName.length >= 3){
          nameNode.classList.add('two-line');
          var splitAt = Math.ceil(displayName.length/2);
          var l1 = el('div','name-line'); l1.textContent = displayName.slice(0,splitAt);
          var l2 = el('div','name-line'); l2.textContent = displayName.slice(splitAt);
          nameNode.appendChild(l1);
          nameNode.appendChild(l2);
        } else {
          nameNode.textContent = displayName;
        }
        cushion.appendChild(nameNode);
      }

      if(mode === 'layout'){
        if(isSquare){
          attachSideDrag(cushion, seat, tbl, baseX, baseY, centerX, centerY, tableW, tableH, posMap);
        } else {
          attachDrag(cushion, seat, baseX, baseY);
        }
        cushion.addEventListener('click', function(){
          if(cushion._dragged){ cushion._dragged=false; return; }
          openFixedModal(seat);
        });
      } else if(mode === 'result'){
        if(!seat.fixedName && seat.name){
          cushion.addEventListener('click', function(seatRef){
            return function(){ openUndoModal(seatRef); };
          }(seat));
        }
      }
      block.appendChild(cushion);
    });
    return block;
  }

  function findSeatByNum(num){
    for(var t=0;t<state.tables.length;t++){
      var tbl = state.tables[t];
      for(var s=0;s<tbl.seats.length;s++){
        if(tbl.seats[s].num === num) return tbl.seats[s];
      }
    }
    return null;
  }
  function findTableForSeat(seatObj){
    for(var t=0;t<state.tables.length;t++){
      if(state.tables[t].seats.indexOf(seatObj)!==-1) return state.tables[t];
    }
    return null;
  }
  function buildMiniTableDiagram(seatObj){
    var tbl = findTableForSeat(seatObj);
    var wrap = el('div','mini-table-wrap');
    wrap.appendChild(el('div','mini-table-label','テーブル '+(tbl?tbl.index:'?')));
    var mt = el('div','mini-table');
    if(tbl){
      var layout;
      if(state.shape === 'circle'){
        layout = computeSeatLayout(tbl.seats.length, 'circle', { circleR:58, circleSize:118 });
      } else {
        var sideLayout = computeSideLayout(tbl.sides, { spacing:30, vSpacing:22, tableDepth:32, rowGap:18, colGap:18 });
        layout = {
          positions: tbl.seats.map(function(s){ return sideLayout.posMap[s.num] || {x:0,y:0}; }),
          tableW: sideLayout.tableW, tableH: sideLayout.tableH
        };
      }
      var box = computeBlockSize(layout, 40);
      mt.style.width = box.w+'px';
      mt.style.height = box.h+'px';
      var centerX = box.w/2, centerY = box.h/2;
      var surf = el('div','mini-table-surface '+state.shape);
      surf.style.width = layout.tableW+'px';
      surf.style.height = layout.tableH+'px';
      surf.style.left = (centerX - layout.tableW/2)+'px';
      surf.style.top = (centerY - layout.tableH/2)+'px';
      mt.appendChild(surf);
      tbl.seats.forEach(function(s, si){
        var pos = layout.positions[si] || {x:0,y:0};
        var isTarget = s.num === seatObj.num;
        var dot = el('div','mini-seat'+(isTarget?' target':''));
        dot.style.left = (centerX+pos.x)+'px';
        dot.style.top = (centerY+pos.y)+'px';
        mt.appendChild(dot);
      });
    }
    wrap.appendChild(mt);
    return wrap;
  }

  function copyToClipboard(text){
    if(navigator.clipboard && navigator.clipboard.writeText){

  function legacyCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus(); ta.select();

  function setTableCount(n){
    n = clamp(n,1,9);
    state.tableCount = n;
    while(state.seatCounts.length < n) state.seatCounts.push(2);
    state.seatCounts.length = n;
    if(n === 1){ state.seatCounts[0] = state.totalParticipants; }
    else { state.seatCounts = distributeSeats(state.totalParticipants, n); }
    render();
  }
  function normalizeSeatCounts(){
    if(state.tableCount === 1){ state.seatCounts[0] = state.totalParticipants; }
    else { state.seatCounts = distributeSeats(state.totalParticipants, state.tableCount); }
  }
  function distributeSeats(total, count){
    var base = Math.floor(total/count);
    var extra = total % count;
    var arr = [];
    for(var i=0;i<count;i++){ arr.push(base + (i < extra ? 1 : 0)); }
    for(var j=0;j<count;j++){ if(arr[j] < 1) arr[j] = 1; }
    return arr;
  }
  function incrementSeatCount(i){
    if((state.seatCounts[i]||1) >= 20) return;
    var n = state.seatCounts.length;
    for(var k=1;k<n;k++){
      var j = (i+k) % n;
      if((state.seatCounts[j]||1) > 1){
        state.seatCounts[i] = (state.seatCounts[i]||1) + 1;
        state.seatCounts[j] = state.seatCounts[j] - 1;
        return;
      }
    }
  }
  function decrementSeatCount(i){
    if((state.seatCounts[i]||1) <= 1) return;
    var n = state.seatCounts.length;
    for(var k=1;k<n;k++){
      var j = (i+k) % n;
      if((state.seatCounts[j]||1) < 20){
        state.seatCounts[i] = state.seatCounts[i] - 1;
        state.seatCounts[j] = (state.seatCounts[j]||1) + 1;
        return;
      }
    }
  }

  /* ================= RENDER: LAYOUT ================= */
  var dragCtx = null;
  function renderLayout(){
    app.innerHTML='';
    app.appendChild(renderTopbar(true));
    var wrap = el('div','screen');
    wrap.appendChild(stepChip(3, '座席レイアウト'));
    var toolbar = el('div','layout-toolbar');
    toolbar.appendChild(el('div','hint-chip','席タップ → 固定席の設定'));
    toolbar.appendChild(el('div','hint-chip','ドラッグで席を移動'));
    wrap.appendChild(toolbar);

    var canvasWrap = el('div','canvas-wrap');
    var inner = el('div','canvas-inner');
    state.tables.forEach(function(tbl){
      inner.appendChild(buildTableBlockDom(tbl, 'layout'));
    });

    canvasWrap.appendChild(inner);
    wrap.appendChild(canvasWrap);

    var nav = el('div','bottom-nav');
    var nameBtn = el('button','primary-btn','くじ引きをはじめる');
    nameBtn.onclick = function(){ prepareBlanks(); goTo('draw'); };
    nav.appendChild(nameBtn);
    wrap.appendChild(nav);
    app.appendChild(wrap);
  }

  function attachDrag(node, seat, baseX, baseY){
    var startX, startY, startDx, startDy, moved;
    node.addEventListener('pointerdown', function(ev){
      ev.preventDefault();
      node.setPointerCapture(ev.pointerId);
      startX = ev.clientX; startY = ev.clientY;
      startDx = seat.dx; startDy = seat.dy;
      moved = false;
      node.classList.add('dragging');
      function onMove(ev2){
        var ddx = ev2.clientX - startX, ddy = ev2.clientY - startY;
        if(Math.abs(ddx)>4 || Math.abs(ddy)>4) moved = true;
        seat.dx = clamp(startDx + ddx, -100, 100);
        seat.dy = clamp(startDy + ddy, -100, 100);
        node.style.left = (baseX+seat.dx)+'px';
        node.style.top = (baseY+seat.dy)+'px';
      }
      function onUp(ev2){
        node.releasePointerCapture(ev.pointerId);
        node.classList.remove('dragging');
        node.removeEventListener('pointermove', onMove);
        node.removeEventListener('pointerup', onUp);
        if(moved) node._dragged = true;
      }
      node.addEventListener('pointermove', onMove);
      node.addEventListener('pointerup', onUp);
    });
  }

  // Square/long table drag: seat can only end up on one of the 4 sides (top/bottom/left/right).
  // On drop, the target side + insertion slot is determined from the drop position, the seat
  // is moved between the tbl.sides arrays, and a full re-render evenly re-spaces every side
  // (so lines stay aligned and gaps stay even automatically).
  function attachSideDrag(node, seat, tbl, baseX, baseY, centerX, centerY, tableW, tableH, posMap){
    var originSide = null;
    ['top','bottom','left','right'].forEach(function(k){
      if(tbl.sides[k].indexOf(seat) !== -1) originSide = k;
    });
    node.addEventListener('pointerdown', function(ev){
      ev.preventDefault();
      node.setPointerCapture(ev.pointerId);
      var startX = ev.clientX, startY = ev.clientY;
      var startLocalX = (baseX + CUSHION_HALF) - centerX;
      var startLocalY = (baseY + CUSHION_HALF) - centerY;
      var curLocalX = startLocalX, curLocalY = startLocalY;
      var moved = false;
      node.classList.add('dragging');
      function onMove(ev2){
        var ddx = ev2.clientX - startX, ddy = ev2.clientY - startY;
        if(Math.abs(ddx)>4 || Math.abs(ddy)>4) moved = true;
        curLocalX = startLocalX + ddx;
        curLocalY = startLocalY + ddy;
        node.style.left = (centerX + curLocalX - CUSHION_HALF)+'px';
        node.style.top = (centerY + curLocalY - CUSHION_HALF)+'px';
      }
      function onUp(ev2){
        node.releasePointerCapture(ev.pointerId);
        node.classList.remove('dragging');
        node.removeEventListener('pointermove', onMove);
        node.removeEventListener('pointerup', onUp);
        if(!moved) return;
        node._dragged = true;

        // Which of the 4 sides is the drop point nearest to? Split the plane into
        // 4 cones around the table center using the corners' angle (aspect-ratio aware).
        var cornerAngle = Math.atan2(tableH/2, tableW/2);
        var theta = Math.atan2(curLocalY, curLocalX);
        var side;
        if(theta > -cornerAngle && theta <= cornerAngle) side = 'right';
        else if(theta > cornerAngle && theta <= (Math.PI - cornerAngle)) side = 'bottom';
        else if(Math.abs(theta) > (Math.PI - cornerAngle)) side = 'left';
        else side = 'top';

        // Find insertion slot within that side based on position along its axis.
        var axisIsX = (side==='top' || side==='bottom');
        var value = axisIsX ? curLocalX : curLocalY;
        var arr = tbl.sides[side].filter(function(s){ return s!==seat; });
        var idx = 0;
        for(var i=0;i<arr.length;i++){
          var p = posMap[arr[i].num];
          var pv = axisIsX ? p.x : p.y;
          if(pv < value) idx++; else break;
        }

        if(originSide){
          var oi = tbl.sides[originSide].indexOf(seat);
          if(oi!==-1) tbl.sides[originSide].splice(oi,1);
        }
        tbl.sides[side].splice(Math.min(idx, tbl.sides[side].length), 0, seat);
        render();
      }
      node.addEventListener('pointermove', onMove);
      node.addEventListener('pointerup', onUp);
    });
  }

  /* ---- fixed seat modal ---- */
  function openFixedModal(seat){
    var overlay = el('div','modal-overlay');
    var box = el('div','modal-box');
    box.appendChild(el('div','modal-title', '席番号 '+seat.num+' の固定設定'));
    var input = el('input','modal-input');
    input.placeholder = '名前を入力（空欄でくじ引き対象）';
    input.value = seat.fixedName || '';
    box.appendChild(input);

    var available = availablePresetNames();
    if(available.length > 0){
      var pickLabel = el('div','field-label','リストから選ぶ');
      pickLabel.style.cssText = 'margin-top:14px; font-size:14px;';
      box.appendChild(pickLabel);
      var chipsWrap = el('div','name-chips');
      chipsWrap.style.marginBottom = '4px';
      available.forEach(function(n){
        var chip = el('button','name-chip', n);
        chip.type = 'button';
        chip.onclick = function(){
          input.value = n;
          input.focus();
        };
        chipsWrap.appendChild(chip);
      });
      box.appendChild(chipsWrap);
    }

    var actions = el('div','modal-actions');
    var save = el('button','modal-save','保存');
    save.onclick = function(){
      var v = input.value.trim();
      seat.fixedName = v ? v : null;
      document.body.removeChild(overlay);
      render();
    };
    var del = el('button','modal-delete','固定解除');
    del.onclick = function(){
      seat.fixedName = null;
      document.body.removeChild(overlay);
      render();
    };
    var cancel = el('button','modal-cancel','閉じる');
    cancel.onclick = function(){ document.body.removeChild(overlay); };
    actions.appendChild(del); actions.appendChild(save);
    box.appendChild(actions);
    box.appendChild((function(){ var c=el('button','ghost-btn','キャンセル'); c.style.marginTop='8px'; c.onclick=cancel.onclick; return c; })());
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    input.focus();
  }

  function openUndoModal(seat){
    var participant = null;
    for(var i=0;i<state.participants.length;i++){
      var p = state.participants[i];
      if(!p.fixed && p.assigned && p.seatNum === seat.num){ participant = p; break; }
    }
    if(!participant) return;
    var overlay = el('div','modal-overlay');
    var box = el('div','modal-box');
    box.appendChild(el('div','modal-title', '席番号 '+seat.num+'（'+participant.name+'）'));
    var msg = el('div',null,'この席の決定を取り消して、くじ引きに戻しますか？');
    msg.style.cssText='font-size:13.5px;color:#8b7ba8;margin-bottom:16px;line-height:1.6;';
    box.appendChild(msg);
    var actions = el('div','modal-actions');
    var del = el('button','modal-delete','削除してくじ引きに戻す');
    del.onclick = function(){
      undoAssignment(participant);
      document.body.removeChild(overlay);
      goBack();
    };
    var cancel = el('button','modal-cancel','キャンセル');
    cancel.onclick = function(){ document.body.removeChild(overlay); };
    actions.appendChild(cancel); actions.appendChild(del);
    box.appendChild(actions);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
  }

  /* ================= DRAW FLOW (1人ずつ: 名前入力 → くじ引き → 番号決定 → 着席) ================= */
  function prepareBlanks(){
    var fixedEntries = [];
    var blankTotal = 0;
    state.tables.forEach(function(tbl){
      tbl.seats.forEach(function(seat){
        if(seat.fixedName){
          fixedEntries.push({ id: uid(), name: seat.fixedName, fixed:true, seatNum: seat.num, assigned:true });
        } else {
          blankTotal++;
        }
      });
    });
    state.participants = fixedEntries;
    state.blankTotal = blankTotal;
    state.draftName = '';
  }

  function undoAssignment(participant){
    var seat = findSeatByNum(participant.seatNum);
    if(seat){ seat.name = null; }
    var idx = state.participants.indexOf(participant);
    if(idx !== -1) state.participants.splice(idx,1);
  }

  /* ================= DRAW SCREEN ================= */
  function renderDraw(){
    app.innerHTML='';
    app.appendChild(renderTopbar(true));
    var wrap = el('div','screen');
    wrap.appendChild(stepChip(4, 'くじ引き'));

    var doneNonFixed = state.participants.filter(function(p){ return !p.fixed && p.assigned; }).length;
    var remainingBlanks = state.blankTotal - doneNonFixed;
    var doneAll = state.participants.filter(function(p){ return p.assigned; }).length;

    var header = el('div','draw-header');
    header.appendChild(el('div','count', doneAll+' / '+state.totalParticipants+' 人 決定済み'));
    wrap.appendChild(header);

    if(remainingBlanks > 0){
      var card = el('div','card');
      card.appendChild(el('div','field-label','名前を入力してください'));
      var input = el('input','modal-input');
      input.style.cssText = 'width:100%; margin-top:10px; margin-bottom:0;';
      input.placeholder = '名前を入力';
      input.value = state.draftName || '';
      input.oninput = function(){ state.draftName = this.value; input.classList.remove('input-error'); };
      card.appendChild(input);

      function startDraw(name){
        name = (name||'').trim();
        if(!name){
          input.classList.add('input-error');
          input.focus();
          return;
        }
        var participant = { id: uid(), name:name, fixed:false, assigned:false, seatNum:null };
        state.participants.push(participant);
        state.draftName = '';
        runLottery(participant);
      }

      var available = availablePresetNames();
      if(available.length > 0){
        var pickLabel = el('div','field-label','リストから選ぶ');
        pickLabel.style.cssText = 'margin-top:16px;';
        card.appendChild(pickLabel);
        var chipsWrap = el('div','name-chips');
        available.forEach(function(n){
          var chip = el('button','name-chip', n);
          chip.type = 'button';
          chip.onclick = function(){
            state.draftName = n;
            input.value = n;
            input.classList.remove('input-error');
            input.blur();
          };
          chipsWrap.appendChild(chip);
        });
        card.appendChild(chipsWrap);
      }
      wrap.appendChild(card);

      var drawBtn = el('button','primary-btn draw-btn-big','くじ引きをする🎲');
      drawBtn.style.marginTop = '14px';
      drawBtn.onclick = function(){ startDraw(state.draftName); };
      wrap.appendChild(drawBtn);
    } else {
      wrap.appendChild(el('div','empty-note','🎉 全員の席が決まりました！'));
      var resultBtn = el('button','primary-btn','結果を見る');
      resultBtn.style.marginTop='24px';
      resultBtn.onclick = function(){ state.lastAssignedSeatNum = null; goTo('result'); };
      wrap.appendChild(resultBtn);
    }

    var decided = state.participants.filter(function(p){ return !p.fixed && p.assigned; });
    if(decided.length>0){
      wrap.appendChild(el('div','section-title','決定済み（削除するとくじ引きに戻ります）'));
      var peek = el('button','peek-link','📋 途中経過の座席表を見る');
      peek.onclick = function(){ state.lastAssignedSeatNum = null; goTo('result'); };
      wrap.appendChild(peek);
      var dlist = el('div','decided-list');
      decided.forEach(function(p){
        var item = el('div','decided-item');
        item.appendChild(el('div','seat-badge', String(p.seatNum)));
        item.appendChild(el('div','dname', p.name));
        var undo = el('button','undo-btn','削除');
        undo.onclick = function(){
          showConfirm(p.name+'さんの席をくじ引きに戻しますか？', function(){
            undoAssignment(p);
            render();
          });
        };
        item.appendChild(undo);
        dlist.appendChild(item);
      });
      wrap.appendChild(dlist);
    }

    app.appendChild(wrap);
  }

  function runLottery(participant){
    var availableSeats = [];
    state.tables.forEach(function(tbl){
      tbl.seats.forEach(function(seat){
        if(!seat.fixedName && !seat.name) availableSeats.push(seat.num);
      });
    });
    if(availableSeats.length===0){ render(); return; }

    var overlay = el('div','lottery-overlay');
    overlay.appendChild(el('div','lottery-name', participant.name+' さん'));
    overlay.appendChild(el('div','lottery-label','あなたの席は…'));
    var numCircle = el('div','lottery-number-circle');
    var numDisplay = el('div','lottery-number','?');
    numCircle.appendChild(numDisplay);
    overlay.appendChild(numCircle);
    var sub = el('div','lottery-sub','');
    overlay.appendChild(sub);
    var miniContainer = el('div');
    overlay.appendChild(miniContainer);
    var okBtn = el('button','lottery-ok','席を確認する');
    overlay.appendChild(okBtn);
    document.body.appendChild(overlay);

    var finalSeat = availableSeats[Math.floor(Math.random()*availableSeats.length)];
    var ticks = 0;
    var maxTicks = 16;
    var interval = setInterval(function(){
      ticks++;
      var randomShown = availableSeats[Math.floor(Math.random()*availableSeats.length)];
      numDisplay.textContent = randomShown;
      playTick();
      if(ticks >= maxTicks){
        clearInterval(interval);
        numDisplay.textContent = finalSeat;
        numDisplay.classList.add('settled');
        sub.textContent = 'の席です';
        var babyImg = document.createElement('img');
        babyImg.src = Math.random() < 0.5 ? MITCHIE_BABY_PURPLE : MITCHIE_BABY_PINK;
        babyImg.className = 'lottery-baby-img';
        babyImg.alt = 'みっちーの子ども';
        overlay.insertBefore(babyImg, miniContainer);
        var seatObj = findSeatByNum(finalSeat);
        if(seatObj){ miniContainer.appendChild(buildMiniTableDiagram(seatObj)); }
        playFanfare();
        burstConfetti();
        okBtn.classList.add('show');
      }
    }, 70 + ticks*4);

    okBtn.onclick = function(){
      var seat = findSeatByNum(finalSeat);
      if(seat){ seat.name = participant.name; }
      participant.assigned = true;
      participant.seatNum = finalSeat;
      document.body.removeChild(overlay);
      state.lastAssignedSeatNum = finalSeat;
      goTo('result');
    };
  }

  /* ================= RESULT SCREEN ================= */
  function renderResult(){
    app.innerHTML='';
    app.appendChild(renderTopbar(true));
    var wrap = el('div','screen');

    var doneAllCheck = state.participants.filter(function(p){ return p.assigned; }).length;
    if(doneAllCheck >= state.totalParticipants){
      var familyWrap = el('div','result-family-wrap');
      var familyImg = document.createElement('img');
      familyImg.src = MITCHIE_FAMILY;
      familyImg.className = 'result-family-img';
      familyImg.alt = 'みっちーファミリー';
      familyWrap.appendChild(familyImg);
      familyWrap.appendChild(el('div','result-family-caption','🎉 全員決定！お疲れさまでした 🎉'));
      wrap.appendChild(familyWrap);
    }

    wrap.appendChild(el('div','section-title','🎊 席順表'));
    wrap.appendChild(el('div','result-note','タップで固定・ドラッグでの移動はここでは無効です'));

    var canvasWrap = el('div','canvas-wrap');
    var inner = el('div','canvas-inner');

    state.tables.forEach(function(tbl){
      inner.appendChild(buildTableBlockDom(tbl, 'result'));
    });
    canvasWrap.appendChild(inner);
    wrap.appendChild(canvasWrap);

    if(state.lastAssignedSeatNum != null){
      var justSeatEl = canvasWrap.querySelector('.cushion[data-seat-num="'+state.lastAssignedSeatNum+'"]');
      if(justSeatEl){
        justSeatEl.classList.add('just-assigned');
        justSeatEl.scrollIntoView({ block:'center', inline:'center' });
      }
    }

    var again = el('button','primary-btn','もう一度くじ引き画面へ');
    again.style.marginTop = '18px';
    again.onclick = function(){ state.lastAssignedSeatNum = null; goBack(); };
    wrap.appendChild(again);
    app.appendChild(wrap);
    fitTableBlocksToWidth(canvasWrap);
  }

  /* ================= ROUTER ================= */
  function render(){
    if(state.step==='start') renderStart();
    else if(state.step==='setup') renderSetup();
    else if(state.step==='layout') renderLayout();
    else if(state.step==='draw') renderDraw();
    else if(state.step==='result') renderResult();
  }

  render();
})();
</script>
