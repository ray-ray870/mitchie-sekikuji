name: 本番に反映

# Actionsタブから手動で実行すると、preview/index.html を本番の index.html に
# コピーしてコミットし、そのあと「自動テスト＆公開」を動かしてサイトを更新します。
# （このワークフローからのコミットでは自動テストが動かない仕組みなので、最後に呼び出す）

on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: プレビューを本番にコピー
        run: cp preview/index.html index.html

      - name: コミットしてプッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Promote preview to production" || echo "変更なし"
          git push

      - name: 自動テスト＆公開を実行
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run test.yml --ref main
