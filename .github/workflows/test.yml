name: 自動テスト＆公開

# push のたびに自動テストが走り、
# 「テストに合格した場合だけ」公開サイト（GitHub Pages）が更新されます。
# テストに失敗した場合は、公開サイトは直前の正常なバージョンのまま変わりません。
#
# ⚠️ 導入時に1回だけ、GitHubの設定変更が必要です：
#   このリポジトリの Settings → Pages → Build and deployment → Source を
#   「Deploy from a branch」から「GitHub Actions」に変更してください。

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}   # Actionsタブから手動実行もできる

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ---- ① テスト：どのpush/PRでも必ず実行 ----
  test:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存パッケージをインストール
        run: npm install

      - name: 自動テストを実行
        run: npm test

  # ---- ② 公開：mainブランチへのpushで、①のテストに合格した時だけ実行 ----
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: GitHub Pages設定
        uses: actions/configure-pages@v5

      - name: 公開用ファイルをアップロード（リポジトリ全体をそのまま）
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4
